<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Ícone SICH - Favicon</title>
  <desc>Ícone da marca SICH com o gradiente padrão rosa/magenta</desc>
  <defs>
    <linearGradient id="sich-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A8A"/>
      <stop offset="50%" stop-color="#D63384"/>
      <stop offset="100%" stop-color="#C8307A"/>
    </linearGradient>
  </defs>

  <!-- soft background texture: faint petal echoes -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#sich-gradient)" stroke-opacity="0.25" stroke-width="10"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#sich-gradient)" stroke-opacity="0.15" stroke-width="6"/>

  <!-- four petals forming a flower, negative space in the middle traces an S curve -->
  <g transform="translate(256,256)">
    <path d="M0,-150 C58,-92 58,-28 0,0 C-58,-28 -58,-92 0,-150 Z M0,150 C58,92 58,28 0,0 C-58,28 -58,92 0,150 Z M-150,0 C-92,-58 -28,-58 0,0 C-28,58 -92,58 -150,0 Z M150,0 C92,-58 28,-58 0,0 C28,58 92,58 150,0 Z" fill="url(#sich-gradient)"/>
  </g>

  <!-- decorative sparkles -->
  <g transform="translate(388,124) scale(1.4)">
    <path d="M0,-20 L6,-6 L20,0 L6,6 L0,20 L-6,6 L-20,0 L-6,-6 Z" fill="url(#sich-gradient)"/>
  </g>
  <g transform="translate(120,392) scale(0.9)">
    <path d="M0,-20 L6,-6 L20,0 L6,6 L0,20 L-6,6 L-20,0 L-6,-6 Z" fill="url(#sich-gradient)" opacity="0.9"/>
  </g>
  <g transform="translate(96,120) scale(0.6)">
    <path d="M0,-20 L6,-6 L20,0 L6,6 L0,20 L-6,6 L-20,0 L-6,-6 Z" fill="url(#sich-gradient)" opacity="0.8"/>
  </g>
</svg>

