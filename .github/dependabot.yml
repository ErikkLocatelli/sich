version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      # Minor/patch bumps land in one PR; majors stay separate for review.
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
